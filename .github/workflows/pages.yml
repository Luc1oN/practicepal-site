name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry-1.outputs.page_url || steps.deploy-retry-2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      # Pages deployments intermittently fail with "Deployment failed, try
      # again later" — retry twice with backoff before failing the job.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-retry-1
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure' && steps.deploy-retry-1.outcome == 'failure'
        run: sleep 60
      - id: deploy-retry-2
        if: steps.deploy.outcome == 'failure' && steps.deploy-retry-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
